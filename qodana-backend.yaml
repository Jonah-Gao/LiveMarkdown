version: "1.0"
linter: jetbrains/qodana-dotnet:2025.2
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses

dotnet:
  sdk: "9.0"
  restore: true
  properties:
    RuntimeIdentifier: win-x64; linux-x64; osx-x64
  tools:
    - name: dotnet-format
      version: "6.0.250603"