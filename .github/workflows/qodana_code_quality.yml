  qodana-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }} # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0 # a full history is required for pull request analysis
      - name: 'Qodana Backend'
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          args: |
            --source-directory,kernel,--config,qodana-backend.yaml
          artifact-name: qodana-backend
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_BACKEND }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
  qodana-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }} # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0 # a full history is required for pull request analysis
      - name: 'Qodana Frontend'
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          args: |
            --source-directory,client,--config,qodana-frontend.yaml
          artifact-name: qodana-frontend
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_FRONTEND }}
          QODANA_ENDPOINT: 'https://qodana.cloud'